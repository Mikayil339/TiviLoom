plugins { id 'com.android.application' }

android {
    namespace 'com.tiviloom.mobile'
    compileSdk 36
    ndkVersion "27.1.12297006"
    defaultConfig {
        applicationId 'com.tiviloom.mobile'
        minSdk 26
        targetSdk 35
        ndk { abiFilters.addAll((project.findProperty("targetAbis") ?: "arm64-v8a,x86_64").split(",")) }
        versionCode 71
        versionName '0.6.11'
        testInstrumentationRunner 'com.tiviloom.mobile.test.NativePlayerTest'
    }
    sourceSets { androidTest { java.srcDirs = ['../instrumentation/src']; manifest.srcFile '../instrumentation/AndroidManifest.xml' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'org.videolan.android:libvlc-all:3.7.6'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

// Rebuild the embedded WebView bundle from the authoritative app/ tree on every build.
tasks.register('syncWebAssets', Copy) {
    from("${projectDir}/../../app")
    into("${projectDir}/src/main/assets/web")
}
tasks.named('preBuild').configure { dependsOn(tasks.named('syncWebAssets')) }
