<!doctype html>
<html lang="az">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TiviLoom · TV player</title><link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="tv.css"><link rel="stylesheet" href="phone.css"></head>
<body><div id="tv-screen">
<div id="app">
  <header class="topbar"><button class="brand" data-action="home" title="TV cədvəli"><img src="assets/logo.png" alt=""><span>Tivi<span class="mint">Loom</span></span></button><span class="lab-badge">KOMPÜTER SINAĞI</span><nav><button data-action="guide" class="nav active">Televiziya</button><button data-action="movies" class="nav">Filmlər</button><button data-action="series" class="nav">Seriallar</button><button data-action="history" class="nav">Tarixçə</button></nav><div class="top-actions"><button data-action="search" title="Axtarış / Ctrl+F" aria-label="Axtarış" class="icon-btn">⌕</button><button data-action="settings" title="Ayarlar" aria-label="Ayarlar" class="icon-btn">⚙</button><time id="clock"></time></div></header>
  <div class="workspace">
    <aside class="rail"><button data-action="guide" aria-label="TV cədvəli" title="TV cədvəli">▤</button><button data-action="favorites" aria-label="Sevimlilər" title="Sevimlilər">☆</button><button data-action="search" aria-label="Axtarış" title="Axtarış">⌕</button><button data-action="import" aria-label="Pleylist əlavə et" title="Pleylist əlavə et">＋</button><span class="rail-spacer"></span><button data-action="help" aria-label="Pult və kömək" title="Pult və kömək">⌘</button><button data-action="settings" aria-label="Ayarlar" title="Ayarlar">⚙</button></aside>
    <aside id="groups" class="groups"></aside>
    <main id="main"><section class="hero"><div id="preview" class="preview"><video id="video" playsinline loop muted></video><div id="preview-label" class="preview-label"><span class="live-dot"></span><span id="preview-status">NÜMUNƏ MƏZMUN</span></div><button id="preview-play" data-action="preview" class="preview-play" aria-label="Önizləməni oynat">▶</button><div id="video-error" class="video-error" hidden></div></div><div class="program-info"><div class="eyebrow" id="program-meta"></div><h1 id="program-title"></h1><div class="time-progress" id="program-time"></div><p id="program-description"></p><div class="info-bottom"><span id="program-tags"></span><button data-action="context" class="text-button">⋯ Daha çox</button></div></div></section><div id="content"></div></main>
  </div>
  <footer><span id="foot-status">Hazırdır</span><div><kbd>↑↓←→</kbd> Seç <kbd>Enter</kbd> Oynat <kbd>Esc</kbd> Geri <kbd>M</kbd> Menyu <button data-action="help">Pult ⌘</button></div></footer>
</div>
<div id="player" class="player" hidden><div id="player-controls"><div class="player-top"><img src="assets/logo.png" alt=""><strong>TiviLoom</strong><span id="player-channel"></span><button data-action="exit-player">✕ Bağla</button></div><div class="player-bottom"><div id="player-info"></div><div class="player-seek"><span id="elapsed">00:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Video mövqeyi"><span id="duration">CANLI</span></div><div class="player-buttons"><button data-action="previous" title="Əvvəlki kanal">|◀</button><button data-action="pause" id="pause-button">Ⅱ Fasilə</button><button data-action="next" title="Növbəti kanal">▶|</button><button data-action="mute" id="mute-button">♪ Səs</button><button data-action="favorite">☆ Sevimli</button><button data-action="display">▣ Ekran</button><button data-action="tracks">☷ Səs / altyazı</button><button data-action="sleep">◷ Yuxu</button><button data-action="pip">▧ PiP</button><button data-action="multiview">⊞ Çoxlu ekran</button></div></div></div></div>
<div id="modal-root"></div><div id="toast" role="status" hidden></div>
<section id="welcome" class="welcome" hidden><div class="welcome-mark"><img src="assets/brand-mark.png" alt=""><span>TiviLoom</span></div><div class="welcome-copy"><h1>TiviLoom does not provide any content</h1><p>Add your own playlist to start watching</p><div class="welcome-actions"><button data-tv="import">Add playlist</button><button data-tv="settings">Settings</button><button data-tv="welcome-back">Back</button></div></div></section><section id="wizard" class="wizard" hidden></section><div id="boot" class="boot" role="img" aria-label="TiviLoom loading"></div></div><script>window.__tiviloomBootStarted=Date.now();</script><script src="assets/hls.min.js"></script><script src="webOSTV.js"></script><script src="bundle.js"></script>
</body></html>
