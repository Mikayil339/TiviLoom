name: TiviLoom Android phone APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'app/**'
      - 'package*.json'
      - 'tests/**'
      - '.github/workflows/android-mobile.yml'
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android build platform
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;35.0.0'"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Build native Android phone APK
        working-directory: android
        run: gradle --no-daemon --max-workers=2 assembleDebug
      - name: Verify installable package signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose android/app/build/outputs/apk/debug/app-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: TiviLoom-0.6.9-Android-personal-test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
